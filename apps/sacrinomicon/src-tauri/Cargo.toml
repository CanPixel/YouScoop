[package]
name = "sacrinomicon"
version = "0.1.0"
description = "A private conversational archive"
authors = ["Can Ur"]
edition = "2021"

[lib]
name = "sacrinomicon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
diagnostics = []

[[example]]
name = "memory_handoff"
required-features = ["diagnostics"]

[[example]]
name = "native_runtime"
required-features = ["diagnostics"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
sha2 = "0.10"
knowledge-core = { path = "../../../crates/knowledge-core" }
local-inference = { path = "../../../crates/local-inference" }
inference-coordinator = { path = "../../../crates/inference-coordinator" }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
whisper-rs = { path = "../../../src-tauri/vendor/whisper-rs", default-features = false }

[patch.crates-io]
whisper-rs-sys = { path = "../../../src-tauri/vendor/whisper-rs-sys" }

[profile.dev.package."*"]
opt-level = 3
