[package]
name = "local-inference"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
llama-cpp-2 = { version = "=0.1.151", default-features = false }
llama-cpp-sys-2 = { version = "=0.1.151", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.151", default-features = false, features = ["metal"] }
llama-cpp-sys-2 = { version = "=0.1.151", default-features = false, features = ["metal"] }

[profile.dev.package."*"]
opt-level = 3
