[package]
name = "youscoop"
version = "0.1.0"
description = "YouScoop: talk to any YouTube video, fully private"
authors = ["Can Ur"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "youscoop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
diagnostics = []

[[example]]
name = "desktop_setup"
required-features = ["diagnostics"]

[[example]]
name = "enrich_video"
required-features = ["diagnostics"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
llama-cpp-2 = { version = "0.1.151", features = ["mtmd", "metal"] }
llama-cpp-sys-2 = { version = "0.1.151", features = ["mtmd", "metal"] }
whisper-rs = { version = "0.16", features = ["metal"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
anyhow = "1"
sha2 = "0.10"
inference-coordinator = { path = "../crates/inference-coordinator" }
thiserror = "2"
# Speaker diarization (pyannote segmentation + speaker embeddings + clustering).
# Static prebuilt libraries; runs in a child process so ingestion can cancel it.
sherpa-onnx = "=1.13.8"
sherpa-onnx-sys = "=1.13.8"

# whisper-rs-sys and llama-cpp-sys-2 each statically link their own ggml; the
# linker keeps only one copy, so the two vendored ggml versions must match or
# op enums skew and llama/whisper misread each other's graphs (abort in
# llama_context::sched_reserve, see vendor/whisper-rs-sys/README-fork.md).
# The vendored fork pins whisper.cpp at ggml 0.13.1 to match llama-cpp-sys-2
# 0.1.151. Keep these in lockstep when bumping either dependency.
[patch.crates-io]
whisper-rs = { path = "vendor/whisper-rs" }
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

[profile.dev.package."*"]
# llama.cpp / whisper.cpp are unusably slow without optimizations
opt-level = 3
